<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · izoora</title>
  <meta name="description" content="Get in touch with the izoora team — orders, returns and general questions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="headerWrapper"></div>

  <div class="page-banner"
    style="background: var(--bg-card); padding: 50px 0; border-bottom: 1px solid var(--line-soft);">
    <div class="wrap">
      <span class="eyebrow"
        style="color: var(--amber-deep); font-size: 13px; text-transform: uppercase; font-weight: 600;">Get in
        Touch</span>
      <h1 style="margin-top: 10px;">We'd love to hear from you</h1>
      <p style="color: var(--cream-dim);">Questions about an order, products, or services — our team replies within one
        business day.</p>
    </div>
  </div>

  <section style="padding: 60px 0;">
    <div class="wrap">
      <div class="contact-grid">
        <div>
          <div class="panel">
            <h4 style="margin-bottom: 6px;">Email Us</h4>
            <p style="font-size: 14.5px; color: var(--cream-dim); margin: 0;">info@izoora.com</p>
          </div>
          <div class="panel">
            <h4 style="margin-bottom: 6px;">Call Us</h4>
            <p style="font-size: 14.5px; color: var(--cream-dim); margin: 0;">+1 (346) 610-7637</p>
          </div>
          <div class="panel">
            <h4 style="margin-bottom: 6px;">Studio</h4>
            <p style="font-size: 14.5px; color: var(--cream-dim); margin: 0;">USA, America</p>
          </div>
        </div>
        <div>
          <form id="contactForm" class="form-card" style="max-width: 100%; margin: 0;">
            <div class="two-col">
              <div class="field"><label>Full Name</label><input name="name" type="text" required placeholder="Jane Doe">
              </div>
              <div class="field"><label>Email Address</label><input name="email" type="email" required
                  placeholder="jane@email.com"></div>
            </div>
            <div class="field"><label>Subject</label><input name="subject" type="text" required
                placeholder="Order question, feedback…"></div>
            <div class="field"><label>Message</label><textarea name="message" rows="5" required
                placeholder="How can we help?"></textarea></div>
            <button class="btn btn-primary btn-block" type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <template id="cartTemplate">
    <div class="wrap" style="padding-top:44px;max-width:760px;">
      <h1>Your bag</h1>
      <div class="empty-state" id="cartEmptyState" style="display:none;">
        <div class="drop"></div>
        <h3>Your bag is empty</h3>
        <p>Browse the collection to find something you love.</p>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="go('#/products')">Shop now</button>
      </div>
      <div id="cartContent" style="display:none;">
        <div class="panel" style="margin-top:24px;">
          <div id="cartItemsList"></div>
          <div class="summary-row total"><span>Total</span><span><span id="cartTotalUSD"></span> <span class="mono" style="font-size:13px;color:var(--cream-dim);" id="cartTotalPKR"></span></span></div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:10px;padding:15px;" onclick="goCheckout()">Proceed to checkout</button>
      </div>
    </div>
  </template>

  <div id="footerWrapper"></div>
  <div class="toast-stack" id="toastStack"></div>

  <script src="script.js"></script>
</body>

</html>
